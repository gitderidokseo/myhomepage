<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>정신건강과 자기돌봄 예상문제</title>
<style>
*{box-sizing:border-box}
:root{
  --bg:#faf9f7;--surface:#ffffff;--ink:#1b1a19;--muted:#6c6762;--faint:#8f8a84;
  --line:#e7e3dc;--line-soft:#f0ece6;--hover:#f3f0eb;
  --accent:#0d7a6f;--accent-ink:#0d7a6f;--accent-soft:#e8f4f2;
  --ok:#1f7a3a;--ok-soft:#e6f4ea;--bad:#b3261e;--bad-soft:#fbe9e7;--star:#b7791f;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#16171a;--surface:#1e2024;--ink:#e9e6e1;--muted:#a7a29b;--faint:#8b857e;
    --line:#32353b;--line-soft:#282b30;--hover:#25282d;
    --accent:#58c2b4;--accent-ink:#7ad2c5;--accent-soft:#1c2f2d;
    --ok:#6fcf8a;--ok-soft:#1a2e21;--bad:#f28b82;--bad-soft:#3a1f1d;--star:#e0b25a;
  }
}
:root[data-theme="dark"]{
  --bg:#16171a;--surface:#1e2024;--ink:#e9e6e1;--muted:#a7a29b;--faint:#8b857e;
  --line:#32353b;--line-soft:#282b30;--hover:#25282d;
  --accent:#58c2b4;--accent-ink:#7ad2c5;--accent-soft:#1c2f2d;
  --ok:#6fcf8a;--ok-soft:#1a2e21;--bad:#f28b82;--bad-soft:#3a1f1d;--star:#e0b25a;
}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,-apple-system,sans-serif;
  font-size:16px;line-height:1.7;-webkit-text-size-adjust:100%}
.wrap{max-width:820px;margin:0 auto;padding:40px 20px}
h1{font-size:1.75rem;line-height:1.3;margin:0 0 10px;letter-spacing:-.02em;font-weight:750}
.lead{color:var(--muted);margin:0 0 22px;font-size:.95rem}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.score{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:16px}
.score-top{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.score b{font-size:1.6rem;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.score small{color:var(--muted);font-size:.88rem}
.meter{height:8px;border-radius:99px;background:var(--line-soft);margin-top:10px;overflow:hidden;display:flex}
.meter i{display:block;height:100%}
.meter .m-ok{background:var(--ok)}.meter .m-bad{background:var(--bad)}
.legend{font-size:.82rem;color:var(--muted);margin-top:8px}
.star{color:var(--star);font-weight:700;letter-spacing:-.05em}

.tools{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 22px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 14px;font-size:.9rem;min-height:38px}
.chip:hover{background:var(--hover)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:650}
.chip.reset{margin-left:auto;color:var(--bad)}

h2{font-size:1.15rem;margin:34px 0 12px;padding-left:12px;border-left:4px solid var(--accent)}
.q{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:12px}
.q.ok{border-color:var(--ok)}.q.bad{border-color:var(--bad)}
.q-head{display:flex;gap:10px;align-items:baseline;margin-bottom:10px}
.q-num{font-weight:750;color:var(--accent-ink);font-variant-numeric:tabular-nums;flex:none}
.q-text{flex:1;min-width:0}
.q-tag{font-size:.75rem;color:var(--faint);white-space:nowrap;flex:none}
.q-quote{margin:4px 0 10px;padding:9px 13px;border-left:3px solid var(--line);background:var(--line-soft);border-radius:0 8px 8px 0;font-size:.94rem}

.opts{display:grid;gap:6px}
.opts.ox{grid-template-columns:1fr 1fr;max-width:320px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;padding:10px 13px;
  border:1px solid var(--line);border-radius:10px;background:var(--bg);min-height:44px}
.opt:hover:not(:disabled){background:var(--hover)}
.opts.ox .opt{justify-content:center;font-size:1.2rem;font-weight:750}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-soft);color:var(--ok);font-weight:650}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad);text-decoration:line-through}
.opt .mk{flex:none;font-variant-numeric:tabular-nums}

.short{display:flex;gap:8px;flex-wrap:wrap}
.short input{flex:1;min-width:180px;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);
  border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.short button{border:1px solid var(--accent);background:var(--accent);color:var(--surface);border-radius:10px;padding:9px 16px;font-weight:650;min-height:44px}
.short button.ghost{background:none;color:var(--accent-ink)}
.short input:disabled{opacity:.8}

.fb{margin-top:12px;padding:11px 14px;border-radius:10px;font-size:.94rem}
.fb.ok{background:var(--ok-soft)}.fb.bad{background:var(--bad-soft)}
.fb .verdict{font-weight:750;margin-right:6px}
.fb.ok .verdict{color:var(--ok)}.fb.bad .verdict{color:var(--bad)}
.fb .src{display:block;margin-top:4px;font-size:.8rem;color:var(--muted)}
.fb .self{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
.fb .self button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 12px;font-size:.85rem;min-height:36px}

.done{display:none;text-align:center;padding:28px 16px;color:var(--muted)}
.empty{padding:20px;text-align:center;color:var(--faint)}
@media (max-width:520px){
  body{font-size:15px}
  .wrap{padding:28px 16px}
  h1{font-size:1.4rem}
  .chip.reset{margin-left:0}
}
</style>
</head>
<body>
<div class="wrap">
  <h1>정신건강과 자기돌봄 — 중간고사 예상문제</h1>
  <p class="lead">실제 시험처럼 OX · 객관식 · 단답형을 섞은 44문항입니다. 답을 고르면 바로 채점되고 해설이 나와요. 단답형은 입력한 뒤 <b>확인</b>을 누르세요. 1~6주차 범위이고, 7주차 특강 문제는 특강을 들은 뒤 추가합니다.</p>

  <div class="score" id="score">
    <div class="score-top"><b id="sc">0 / 44</b><small id="scd">아직 푼 문제가 없어요</small></div>
    <div class="meter"><i class="m-ok" id="mok"></i><i class="m-bad" id="mbad"></i></div>
    <div class="legend" id="sync">채점 기록은 이 기기에 저장돼요</div>
    <div class="legend"><span class="star">★★★</span> 교수님이 시험에 낸다고 한 내용 · <span class="star">★★</span> 꼭 알아야 한다고 강조 · <span class="star">★</span> 수업에서 강조</div>
  </div>

  <div class="tools" role="group" aria-label="문제 거르기">
    <button class="chip" data-f="all" aria-pressed="true">전체</button>
    <button class="chip" data-f="ox" aria-pressed="false">OX</button>
    <button class="chip" data-f="mc" aria-pressed="false">객관식</button>
    <button class="chip" data-f="sa" aria-pressed="false">단답형</button>
    <button class="chip" data-f="star" aria-pressed="false">★★ 이상</button>
    <button class="chip" data-f="todo" aria-pressed="false">안 푼 문제</button>
    <button class="chip" data-f="wrong" aria-pressed="false">틀린 문제</button>
    <button class="chip reset" id="reset">처음부터</button>
  </div>

  <div id="list"></div>
</div>

<script>
const Q = [
  // ── OX ──
  {t:"ox", s:3, w:"2주차", q:"리프(Ryff)의 심리적 안녕감 6요소에는 '긍정 정서'가 포함된다.", a:"X",
   e:"6요소는 삶의 목적·환경 통제·관계·자율성·성장·자기수용(목·환·관·자·성·수)입니다. 긍정 정서(긍정정서성)는 외향성의 하위요인이에요."},
  {t:"ox", s:3, w:"2주차", q:"리프의 '환경 통제'는 학생이라면 시험을 보고 과제를 제때 내는 것처럼, 나에게 주어진 일을 책임감 있게 해내는 것을 말한다.", a:"O",
   e:"교수님이 학생 예시로 설명한 그대로입니다. '숙달'이라고도 불러요."},
  {t:"ox", s:2, w:"2주차", q:"리프의 심리적 안녕감은 디너의 주관적 안녕감보다 더 주관적인 잣대다.", a:"X",
   e:"반대예요. 심리적 안녕감은 충족되어야 할 구체적 항목 6개를 내세우므로 덜 주관적입니다. 디너는 '내가 내 삶을 평가'하는 것이 핵심이라 '주관적'이 중요해요."},
  {t:"ox", s:1, w:"2주차", q:"정신건강 실현의 4수준에서 리프의 심리적 안녕감은 '적극적인 삶'(심리적·사회적 수준)에 해당한다.", a:"O",
   e:"① 신체 감각적(활기찬 삶) ② 정서적·심리적(즐거운 삶, 디너) ③ 심리적·사회적(적극적인 삶, 리프) ④ 사회적·영적(의미 있는 삶)."},
  {t:"ox", s:2, w:"2주차", q:"요즘은 주관적 고통을 중요하게 보므로, 본인이 고통을 느끼지 않으면 부적응이라고 볼 수 없다.", a:"X",
   e:"'나는 재림 예수다'처럼 고통이 없는 부적응도 있어요. 교수님: 4기준(통계적·규범적·주관적 고통·역기능적) 중 한 가지만으로 판단하면 안 됩니다."},
  {t:"ox", s:2, w:"2주차", q:"벡 우울척도(BDI) 총점이 24점 이상이면 그 점수만으로 우울장애를 진단할 수 있다.", a:"X",
   e:"24점 이상은 '심한 우울 상태'로 해석할 뿐이에요. 단일 척도 점수만으로 진단하면 안 된다고 강조하셨어요."},
  {t:"ox", s:1, w:"2주차", q:"DSM-5는 미국정신의학회가 펴낸 진단 편람으로, 앞으로도 계속 수정·추가될 수 있다.", a:"O",
   e:"판 번호(5)가 붙는 이유가 계속 업데이트되기 때문입니다. 완성된 정답이 아니에요."},
  {t:"ox", s:2, w:"3주차", q:"'손주를 돌보는 조부모일수록 건강하다'는 상관연구 결과가 있다면, 손주 돌봄이 건강의 원인이라고 결론 내릴 수 있다.", a:"X",
   e:"상관 ≠ 인과. 건강해서 손주를 돌볼 수도 있어요. 원인을 알려면 실험(독립변인 조작, 실험·통제집단 비교)이 필요합니다."},
  {t:"ox", s:0, w:"3주차", q:"류보머스키의 6주 실험에서는 감사 목록을 주 3회 쓴 집단이 주 1회 쓴 집단보다 행복 수준이 더 많이 올랐다.", a:"X",
   e:"주 1회 집단만 행복이 올랐고 주 3회는 변화가 없었어요. 연구자 해석: 주 3회는 숙제처럼 느껴진다."},
  {t:"ox", s:1, w:"3주차", q:"자기복잡성이 높은 사람은 한 영역에서 실패해도 다른 영역의 내가 버텨 주어 정신건강에 유리하다.", a:"O",
   e:"린빌(1985)의 자기복잡성. 정서적 완충 효과가 있어요. '복잡한 성격'이라는 뜻이 아닙니다."},
  {t:"ox", s:2, w:"3주차", q:"반두라의 자기효능감에 영향을 주는 요인 중 대학생 시기에 가장 중요한 것은 '언어적 격려'다.", a:"X",
   e:"대학생 시기에는 '대리 경험'(나와 비슷한 사람이 해내는 것을 봄)이 가장 중요하다고 했어요. 언어적 격려는 어릴수록 영향이 큽니다."},
  {t:"ox", s:2, w:"4주차", q:"수업에서 정의한 성격의 핵심은 일관성이다. 그래서 밖에서만 수다스럽고 집에서는 과묵하다면, 수다스러움은 그 사람의 성격 특징으로 보기 어렵다.", a:"O",
   e:"성격 = 환경 적응·대인관계에서 일관성 있게 나타나는 행동·사고 양식. 교수님이 든 예시 그대로입니다."},
  {t:"ox", s:2, w:"4주차", q:"성격 5요인 검사에서 내 신경성 점수가 평균보다 1~2점 높다면, 나는 신경성이 높은 사람으로 확실히 분류된다.", a:"X",
   e:"교수님: \"1점 2점이 그렇게 크게 중요한 절대적인 내용을 가지진 않습니다. 경향성만 보시면 돼요.\""},
  {t:"ox", s:0, w:"5주차", q:"외로움은 관계나 접촉이 객관적으로 부족한 상태를 말한다.", a:"X",
   e:"그건 '사회적 고립'이에요. 외로움은 원하는 관계와 실제 관계의 차이를 느끼는 주관적 경험이라, 많은 사람 속에서도 외로울 수 있어요."},
  {t:"ox", s:1, w:"5주차", q:"사이버볼 실험에서 따돌림을 당한 사람은 신체적 통증을 처리하는 뇌 부위(dACC)가 활성화되었다.", a:"O",
   e:"사회적 고통이 신체적 고통처럼 처리된다는 근거예요. 진화 환경에서 관계가 생존에 중요했기 때문입니다. 타이레놀 3주 복용으로 상처받은 감정이 줄었다는 연구도 함께 나왔어요."},
  {t:"ox", s:1, w:"6주차", q:"라자루스는 스트레스를 일으키는 사건 자체가 그 사건에 대한 해석보다 더 중요하다고 보았다.", a:"X",
   e:"반대예요. \"사건에 대한 해석이 사건 자체보다 더 중요하다.\" 1차 평가(스트레스인가)와 2차 평가(통제할 수 있는가)를 거칩니다."},
  {t:"ox", s:1, w:"6주차", q:"입학·취직·연애 시작처럼 긍정적인 삶의 변화도 스트레스의 원인이 될 수 있다.", a:"O",
   e:"삶의 변화는 생활 양식을 바꿔야 해서 에너지를 소모하므로, 좋은 변화도 스트레스가 됩니다."},
  {t:"ox", s:1, w:"6주차", q:"소음 실험에서 버튼으로 소음을 끌 수 있다고 안내받은 집단은 버튼을 자주 눌렀기 때문에 수행이 더 좋았다.", a:"X",
   e:"버튼은 거의 누르지 않았어요. 통제할 수 있다고 '믿기만 해도' 스트레스 강도가 줄어든다는 것이 핵심입니다(통제 가능성)."},
  {t:"ox", s:1, w:"6주차", q:"회피는 스트레스에 대한 효과적인 장기 대처 방법이다.", a:"X",
   e:"회피는 부적응적 대처 5종(포기·회피·공격성 표출·쾌락 추구·자기 탓) 중 하나예요. 단기적 효과만 있어 '짧게만' 쓰라고 했어요."},
  {t:"ox", s:0, w:"6주차", q:"수업에서 말한 대처(coping)는 스트레스를 완전히 없애는 통제(control)를 뜻한다.", a:"X",
   e:"대처는 관리(manage)이지 통제(control)가 아닙니다. 대처의 특징: 과정 · 학습된 반응 패턴 · 노력 필요 · 관리."},

  // ── 객관식 ──
  {t:"mc", s:3, w:"2주차", q:"리프(Ryff)의 심리적 안녕감 6요소가 <b>아닌</b> 것은?",
   o:["자율성","개인적 성장","주관적 만족감","자기수용"], a:2,
   e:"6요소 = 삶의 목적·환경 통제·관계·자율성·성장·자기수용. '주관적 만족감'은 디너의 주관적 안녕감 쪽 개념이에요."},
  {t:"mc", s:3, w:"2주차", q:"\"스스로 생각하고 결정하며, 사회적 압력에 휘둘리지 않고 행동한다.\" 리프의 어떤 요소인가? (교수님: \"지표를 만든다면 꼭 넣을 것\")",
   o:["삶의 목적","환경 통제","자율성","자기수용"], a:2,
   e:"자율성. 같은 시간에 '성장'은 \"굉장히 중요한 요소\"라고 하셨어요."},

const KEY = "mh-midterm-quiz-v1";
const store = {
  get(){ try{ return JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){ return {}; } },
  set(v){ try{ localStorage.setItem(KEY, JSON.stringify(v)); }catch(e){} }
};
let ans = store.get();          // { idx: {v: 선택값/입력, ok: bool} }

// 수업노트 아티팩트 안에서 열면 채점 기록을 아티팩트 저장소(db)에도 남긴다.
// 문서는 뷰어(index.html)의 iframe 안에서 열리므로 부모 창의 claude를 쓴다. 없으면 localStorage만 쓴다.
const QUIZ_ID = "mh-yesang-1";
const remote = {
  ref: null,
  async connect(){
    let C = window.claude;
    try { if (!C && parent !== window) C = parent.claude; } catch(e){}
    if (!C || !C.use) return;
    const [db, user] = await Promise.all([C.use("db"), C.use("user")]);
    const uid = db && user && await user.id();
    if (!uid) return;
    let ref;
    try { ref = db.collection("quiz").doc(QUIZ_ID).collection("results").doc(uid); } catch(e){ return; }
    try {
      const snap = await ref.get();
      const saved = snap.exists ? (snap.data().answers || {}) : {};
      // 저장소 기록을 기본으로, 이 기기에서만 푼 문제를 더한다
      const merged = {...ans, ...saved};
      const extra = Object.keys(merged).length !== Object.keys(saved).length;
      ans = merged; store.set(ans); render();
      this.ref = ref;
      if (extra || !snap.exists) this.push();
      $("#sync").textContent = "채점 기록이 서버에 저장돼요 (다른 기기에서도 이어서 풀 수 있어요)";
    } catch(e){ $("#sync").textContent = "저장소에 연결하지 못해 이 기기에만 저장돼요"; }
  },
  push(){
    if (!this.ref) return;
    const ok = Object.values(ans).filter(r => r.ok).length;
    this.ref.set({answers: ans, ok, done: Object.keys(ans).length, total: Q.length, updatedAt: new Date().toISOString()})
      .catch(() => { $("#sync").textContent = "저장소에 쓰지 못해 이 기기에만 저장돼요"; });
  }
};
let filter = "all";
const $ = s => document.querySelector(s);
const stars = n => n ? `<span class="star" title="중요도">${"★".repeat(n)}</span>` : "";
const norm = s => s.toLowerCase().replace(/[\s·.,()\-–—'"]/g, "");
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const SECT = {ox:"Ⅰ. OX 문제", mc:"Ⅱ. 객관식", sa:"Ⅲ. 단답형"};

function correctText(q){
  if (q.t === "ox") return q.a;
  if (q.t === "mc") return `${"①②③④"[q.a]} ${q.o[q.a]}`;
  return q.show;
}

function feedback(q, r){
  const self = q.t === "sa" && !r.ok
    ? `<div class="self"><button data-self="1">내 답도 맞아요 (정답 처리)</button></div>` : "";
  return `<div class="fb ${r.ok ? "ok" : "bad"}" role="status">
    <span class="verdict">${r.ok ? "정답" : "오답"}</span>${r.ok ? "" : `정답: <b>${esc(correctText(q))}</b>`}
    <div>${q.e}</div><span class="src">근거: ${q.w}</span>${self}</div>`;
}

function card(q, i){
  const r = ans[i];
  let body = "";
  if (q.t === "ox" || q.t === "mc") {
    const opts = q.t === "ox" ? ["O","X"] : q.o;
    body = `<div class="opts ${q.t === "ox" ? "ox" : ""}">${opts.map((o, k) => {
      const val = q.t === "ox" ? o : k;
      let cls = "";
      if (r) { if (val === q.a) cls = "right"; else if (val === r.v) cls = "wrong"; }
      const mk = q.t === "mc" ? `<span class="mk">${"①②③④"[k]}</span>` : "";
      return `<button class="opt ${cls}" data-v="${val}" ${r ? "disabled" : ""}>${mk}<span>${o}</span></button>`;
    }).join("")}</div>`;
  } else {
    body = `<form class="short" data-sa="${i}">
      <input type="text" placeholder="답을 입력하세요" value="${r ? esc(r.v) : ""}" ${r ? "disabled" : ""} autocomplete="off" aria-label="${i + 1}번 답">
      ${r ? "" : `<button type="submit">확인</button><button type="button" class="ghost" data-giveup="1">모르겠어요</button>`}
    </form>`;
  }
  const state = r ? (r.ok ? "ok" : "bad") : "";
  return `<article class="q ${state}" data-i="${i}">
    <div class="q-head"><span class="q-num">${i + 1}</span><div class="q-text">${q.q}</div>
      <span class="q-tag">${stars(q.s)} ${q.w}</span></div>
    ${body}${r ? feedback(q, r) : ""}</article>`;
}

function visible(q, i){
  const r = ans[i];
  switch (filter) {
    case "ox": case "mc": case "sa": return q.t === filter;
    case "star": return q.s >= 2;
    case "todo": return !r;
    case "wrong": return r && !r.ok;
    default: return true;
  }
}

function render(){
  let html = "", last = null, n = 0;
  Q.forEach((q, i) => {
    if (!visible(q, i)) return;
    if (q.t !== last) { html += `<h2>${SECT[q.t]}</h2>`; last = q.t; }
    html += card(q, i); n++;
  });
  $("#list").innerHTML = n ? html : `<p class="empty">해당하는 문제가 없어요.</p>`;
  score();
}

function score(){
  const done = Object.keys(ans).length;
  const ok = Object.values(ans).filter(r => r.ok).length;
  $("#sc").textContent = `${ok} / ${Q.length}`;
  $("#scd").textContent = done
    ? `${done}문항 풀이 · 정답률 ${Math.round(ok / done * 100)}%${done === Q.length ? " · 다 풀었어요! 틀린 문제만 다시 보세요" : ""}`
    : "아직 푼 문제가 없어요";
  $("#mok").style.width = (ok / Q.length * 100) + "%";
  $("#mbad").style.width = ((done - ok) / Q.length * 100) + "%";
}

function save(i, v, ok){
  ans[i] = {v, ok}; store.set(ans); remote.push();
  const el = document.querySelector(`.q[data-i="${i}"]`);
  // 필터가 '안 푼 문제'여도 방금 푼 카드는 그 자리에서 결과를 보여 준다
  if (el) el.outerHTML = card(Q[i], i);
  score();
}

$("#list").addEventListener("click", e => {
  const art = e.target.closest(".q"); if (!art) return;
  const i = +art.dataset.i, q = Q[i];
  const opt = e.target.closest(".opt");
  if (opt && !opt.disabled) {
    const v = q.t === "ox" ? opt.dataset.v : +opt.dataset.v;
    return save(i, v, v === q.a);
  }
  if (e.target.closest("[data-giveup]")) {
    const v = art.querySelector("input").value.trim();
    return save(i, v || "(모름)", false);
  }
  if (e.target.closest("[data-self]")) return save(i, ans[i].v, true);
});

$("#list").addEventListener("submit", e => {
  e.preventDefault();
  const i = +e.target.dataset.sa, q = Q[i];
  const v = e.target.querySelector("input").value.trim();
  if (!v) return e.target.querySelector("input").focus();
  save(i, v, q.a.includes(norm(v)));
});

document.querySelectorAll(".chip[data-f]").forEach(b => b.addEventListener("click", () => {
  filter = b.dataset.f;
  document.querySelectorAll(".chip[data-f]").forEach(x => x.setAttribute("aria-pressed", x === b));
  render();
}));

$("#reset").addEventListener("click", () => {
  if (!confirm("푼 기록을 모두 지우고 처음부터 풀까요?")) return;
  ans = {}; store.set(ans); remote.push(); render();
});

render();
remote.connect();
</script>
</body>
</html>
