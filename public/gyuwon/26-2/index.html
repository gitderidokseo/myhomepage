<style>
*{box-sizing:border-box}
:root{
  --bg:#faf9f7;--surface:#ffffff;--ink:#1b1a19;--muted:#6c6762;--faint:#8f8a84;
  --line:#e7e3dc;--line-soft:#f0ece6;--hover:#f3f0eb;
  --accent:#0d7a6f;--accent-ink:#0b6b61;--accent-soft:#e8f4f2;--on-accent:#ffffff;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#16171a;--surface:#1e2024;--ink:#e9e6e1;--muted:#a7a29b;--faint:#8b857e;
    --line:#32353b;--line-soft:#282b30;--hover:#25282d;
    --accent:#58c2b4;--accent-ink:#7ad2c5;--accent-soft:#1c2f2d;--on-accent:#0f1a19;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#16171a;--surface:#1e2024;--ink:#e9e6e1;--muted:#a7a29b;--faint:#8b857e;
  --line:#32353b;--line-soft:#282b30;--hover:#25282d;
  --accent:#58c2b4;--accent-ink:#7ad2c5;--accent-soft:#1c2f2d;--on-accent:#0f1a19;
}
body{background:var(--bg);color:var(--ink);
  font-family:"Apple SD Gothic Neo","Pretendard","Malgun Gothic",system-ui,-apple-system,sans-serif;
  font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* 고정 높이 대신 페이지 전체가 스크롤됩니다 (iOS에서 안쪽 스크롤 영역이 막히는 문제 방지) */
.app{display:grid;grid-template-columns:320px 1fr;align-items:start;min-height:100vh}
.side{position:sticky;top:0;max-height:100vh;max-height:100dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;background:var(--surface);border-right:1px solid var(--line);min-height:100vh}
.main{display:flex;flex-direction:column;min-width:0;min-height:100vh}

/* ── 사이드바 ── */
.brand{padding:20px 20px 12px;display:grid;gap:2px}
.brand h1{margin:0;font-size:1.3rem;letter-spacing:-.02em;font-weight:750;text-wrap:balance}
.brand small{color:var(--faint);font-size:.78rem}
.search{margin:4px 16px 12px;position:relative}
.search input{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);
  border:1px solid var(--line);border-radius:10px;padding:9px 12px 9px 34px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--faint)}
.tree{padding:0 8px 32px;display:grid;gap:2px}
.subj>button{width:100%;display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:10px;
  font-weight:650;min-height:44px}
.subj>button:hover{background:var(--hover)}
.subj>button .chev{margin-left:auto;color:var(--faint);transition:transform .15s}
.subj.open>button .chev{transform:rotate(90deg)}
.subj>button .n{font-size:.75rem;color:var(--faint);font-weight:500;font-variant-numeric:tabular-nums}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--c)}
.weeks{display:none;padding:2px 0 10px 16px}
.subj.open .weeks,.tree.filtering .weeks{display:block}
.wk{margin-top:6px}
.wk h3{margin:0;padding:6px 12px 4px;font-size:.72rem;font-weight:650;letter-spacing:.06em;color:var(--muted);
  display:flex;gap:8px;align-items:baseline}
.wk h3 span{font-weight:500;letter-spacing:0;color:var(--faint);font-variant-numeric:tabular-nums}
.doc{display:block;width:100%;padding:8px 12px;border-radius:8px;font-size:.93rem;color:var(--ink);
  min-height:40px;border-left:3px solid transparent}
.doc:hover{background:var(--hover)}
.doc[aria-current="true"]{background:var(--accent-soft);border-left-color:var(--accent);color:var(--accent-ink);font-weight:650}
.empty{padding:16px 12px;color:var(--faint);font-size:.9rem}

/* ── 본문 ── */
.bar{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line);
  background:var(--surface);min-height:56px;position:sticky;top:env(safe-area-inset-top,0px);z-index:2}
.back{display:none;align-items:center;gap:2px;color:var(--accent-ink);font-weight:600;padding:8px 8px 8px 0;min-height:44px}
.crumb{flex:1;min-width:0;display:grid}
.crumb b{font-size:.98rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb small{font-size:.76rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{display:flex;gap:4px}
.nav button{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--ink);border:1px solid var(--line)}
.nav button:hover:not(:disabled){background:var(--hover)}
.nav button:disabled{opacity:.35;cursor:default}
.pane{flex:1;background:var(--bg)}
.pane iframe{display:block;width:100%;border:0;min-height:80vh;background:var(--bg)}
.welcome{padding:48px 24px;max-width:520px;margin:0 auto;color:var(--muted)}
.welcome h2{color:var(--ink);font-size:1.2rem;margin:0 0 8px}

/* 사이드바 열기/닫기 (데스크톱) */
.toggle{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;flex:none;
  color:var(--ink);border:1px solid var(--line)}
.toggle:hover{background:var(--hover)}
body.collapsed .app{grid-template-columns:1fr}
body.collapsed .side{display:none}

@media (max-width:767px){
  .toggle{display:none}
  .app{grid-template-columns:1fr}
  .side{border-right:0;position:static;max-height:none;overflow:visible}
  .main{display:none}
  body.reading .side{display:none}
  body.reading .main{display:flex}
  .back{display:inline-flex}
  .bar{padding:6px 12px}
  .nav button{width:44px;height:44px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const INLINE = {"132": "<!DOCTYPE html><html lang=\"ko\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width, initial-scale=1\"><title>일본어 표현연습 — 추가 문법 정리<\/title><style>\n*{box-sizing:border-box}\n:root{\n  --bg:#faf9f7;--surface:#ffffff;--ink:#1b1a19;--muted:#6c6762;--faint:#8f8a84;\n  --line:#e7e3dc;--line-soft:#f0ece6;\n  --accent:#0d7a6f;--accent-ink:#0d7a6f;--accent-soft:#e8f4f2;\n  --code-bg:#f4f1ec;\n}\n@media (prefers-color-scheme:dark){\n  :root{\n    --bg:#16171a;--surface:#1e2024;--ink:#e9e6e1;--muted:#a7a29b;--faint:#8b857e;\n    --line:#32353b;--line-soft:#282b30;\n    --accent:#58c2b4;--accent-ink:#7ad2c5;--accent-soft:#1c2f2d;\n    --code-bg:#22252a;\n  }\n}\nbody{background:var(--bg);color:var(--ink);\n  font-family:\"Pretendard\",\"Apple SD Gothic Neo\",\"Malgun Gothic\",\"\\B9D1\\C740 \\ACE0\\B515\",system-ui,-apple-system,sans-serif;\n  font-size:16px;line-height:1.8;-webkit-text-size-adjust:100%}\n.wrap{max-width:820px;margin:0 auto;padding-block:40px;padding-left:20px;padding-right:20px}\nh1{font-size:1.85rem;line-height:1.3;margin:0 0 26px;padding-bottom:16px;border-bottom:3px solid var(--accent);\n  letter-spacing:-.02em;font-weight:750}\nh2{font-size:1.25rem;margin:44px 0 14px;padding-left:13px;border-left:4px solid var(--accent);\n  line-height:1.4;letter-spacing:-.01em;font-weight:700}\nh3{font-size:1.05rem;margin:28px 0 9px;color:var(--accent-ink);font-weight:700}\nh4{font-size:.97rem;margin:20px 0 7px;font-weight:700}\nh5,h6{font-size:.92rem;margin:16px 0 6px;font-weight:700;color:var(--muted)}\np{margin:0 0 14px}\nul,ol{margin:0 0 15px;padding-left:24px}\nli{margin-bottom:7px}\nli>ul,li>ol{margin-top:7px;margin-bottom:4px}\nstrong{font-weight:700}\nem{font-style:italic}\ndel{color:var(--faint)}\na{color:var(--accent-ink);text-decoration:underline;text-underline-offset:2px}\nhr{border:0;border-top:1px solid var(--line);margin:32px 0}\ncode{font-family:ui-monospace,SFMono-Regular,Consolas,\"D2Coding\",monospace;font-size:.89em;\n  background:var(--code-bg);padding:2px 6px;border-radius:4px}\npre{background:var(--surface);border:1px solid var(--line);border-radius:10px;\n  padding:15px 17px;overflow-x:auto;margin:18px 0;line-height:1.6}\npre code{background:none;padding:0;font-size:.86rem;white-space:pre}\nblockquote{margin:18px 0;padding:13px 18px;border-left:4px solid var(--accent);\n  background:var(--accent-soft);border-radius:0 8px 8px 0}\nblockquote p:last-child{margin-bottom:0}\nblockquote h1,blockquote h2,blockquote h3{margin-top:4px;border:0;padding:0}\nblockquote h1{font-size:1.25rem;margin-bottom:6px;padding-bottom:0}\nblockquote h2{font-size:1.1rem;margin-bottom:6px}\n.tablewrap{overflow-x:auto;margin:18px 0;-webkit-overflow-scrolling:touch}\ntable{border-collapse:collapse;width:100%;font-size:.93rem;min-width:420px}\nth,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}\nth{background:var(--line-soft);font-weight:700;font-size:.85rem}\ntd:first-child{font-weight:600}\nfooter.gen{margin-top:48px;padding-top:16px;border-top:1px solid var(--line);\n  font-size:.8rem;color:var(--faint)}\n@media (max-width:520px){\n  body{font-size:15px}\n  .wrap{padding-block:28px}\n  h1{font-size:1.42rem}\n  h2{font-size:1.1rem}\n}\n@media print{\n  body{background:#fff;font-size:10.5pt;line-height:1.55}\n  .wrap{padding:0;max-width:none}\n  h2,h3{page-break-after:avoid}\n  pre,blockquote,table,.tablewrap{page-break-inside:avoid}\n  a{color:inherit;text-decoration:none}\n}\n<\/style><\/head><body><div class=\"wrap\">\n<h1>일본어 표현연습 — 추가 문법 정리<\/h1>\n<blockquote><p>질문하면서 정리한 문법 보충 자료입니다. ① 가능형 + が, ② さえ, ③ など・なんか・なんて, ④ やら・とか・だの・にしても, ⑤ というのは・といえば, ⑥ くらい・ばかり, ⑦ これだけ.<\/p><\/blockquote>\n\n<h2>① 가능형 동사는 목적어에 が<\/h2>\n<p>「子供でさえスマホ<strong>が<\/strong>使える」에서 を가 아니라 が인 이유: 使う(사용하다)는 동작이라 「スマホを使う」지만, 가능형 使える는 \"할 수 있는 <strong>상태<\/strong>\"라서 대상을 が로 받는 게 기본입니다. 分かる・できる・好きだ도 같은 원리예요.<\/p>\n<ul>\n<li>日本語<strong>が<\/strong>分かる (일본어를 안다)<\/li>\n<li>ピアノ<strong>が<\/strong>弾ける (피아노를 칠 수 있다)<\/li>\n<li>寿司<strong>が<\/strong>好きだ (초밥을 좋아한다)<\/li>\n<\/ul>\n<p>요즘 회화에서는 「スマホを使える」도 자주 쓰고 틀린 건 아닙니다. が가 더 교과서적인 형태예요.<\/p>\n\n<h2>② さえ — 예상 밖이라서 \"~조차\"<\/h2>\n<p>사람이 주어일 때는 「子供さえ」보다 <strong>「子供でさえ」<\/strong>가 더 자연스럽습니다.<\/p>\n<ol>\n<li>小学生でさえこの問題が解ける。<br>(쇼우각세이데사에 코노 몬다이가 토케루) 초등학생조차 이 문제를 풀 수 있다.<\/li>\n<li>先生でさえ答えが分からなかった。<br>(센세이데사에 코타에가 와카라나캇타) 선생님조차 답을 몰랐다.<\/li>\n<li>うちの犬でさえ自分の名前が分かる。<br>(우치노 이누데사에 지분노 나마에가 와카루) 우리 개조차 자기 이름을 안다.<\/li>\n<li>忙しくて水を飲む時間さえない。<br>(이소가시쿠테 미즈오 노무 지칸사에 나이) 바빠서 물 마실 시간조차 없다.<\/li>\n<li>彼は自分の誕生日さえ忘れていた。<br>(카레와 지분노 탄조우비사에 와스레테이타) 그는 자기 생일조차 잊고 있었다.<\/li>\n<li>祖母でさえスマホで動画が見られる。<br>(소보데사에 스마호데 도우가가 미라레루) 할머니조차 스마트폰으로 영상을 볼 수 있다.<\/li>\n<\/ol>\n<p>1·3·6번은 \"가능형 + が\" 구조라 ①과 같이 익혀두면 좋습니다.<\/p>\n\n<h2>③ など · なんか · なんて<\/h2>\n<p>셋 다 \"~같은 것, ~따위, ~등\"이지만 <strong>격식 정도<\/strong>와 <strong>감정의 강도<\/strong>가 다릅니다.<\/p>\n<h3>など (나도) — 문어체·격식체, 중립적<\/h3>\n<p>예시 나열(\"~등\")과 겸손하게 낮출 때.<\/p>\n<ul>\n<li>りんごやバナナ<strong>など<\/strong>を買った。 (링고야 바나나나도오 캇타) 사과나 바나나 등을 샀다.<\/li>\n<li>私<strong>など<\/strong>まだまだです。 (와타시나도 마다마다데스) 저 같은 건 아직 멀었어요.<\/li>\n<li>お茶<strong>など<\/strong>いかがですか。 (오챠나도 이카가데스카) 차라도 한잔 어떠세요?<\/li>\n<\/ul>\n<h3>なんか (낭카) — など의 회화체<\/h3>\n<p>낮추는 뉘앙스가 조금 더 강하고, \"뭔가\"라는 뜻으로도 쓰입니다.<\/p>\n<ul>\n<li>コーヒー<strong>なんか<\/strong>どう? (코히낭카 도우?) 커피 같은 거 어때?<\/li>\n<li>俺<strong>なんか<\/strong>無理だよ。 (오레낭카 무리다요) 나 따위는 무리야.<\/li>\n<li>勉強<strong>なんか<\/strong>したくない。 (벵쿄우낭카 시타쿠나이) 공부 같은 거 하기 싫어.<\/li>\n<\/ul>\n<h3>なんて (난테) — 감정이 가장 강함<\/h3>\n<p>놀람·경멸·감탄을 담아 \"~라니!\", \"~따위\". 문장 전체를 받아 \"~하다니\"로도 쓸 수 있는 게 큰 차이입니다.<\/p>\n<ul>\n<li>彼が結婚する<strong>なんて<\/strong>信じられない。 (카레가 켁콘스루난테 신지라레나이) 그가 결혼하다니 믿을 수 없어.<\/li>\n<li>幽霊<strong>なんて<\/strong>いるわけない。 (유우레이난테 이루와케나이) 유령 따위 있을 리 없어.<\/li>\n<li>一人で行く<strong>なんて<\/strong>危ないよ。 (히토리데 이쿠난테 아부나이요) 혼자 가다니 위험해.<\/li>\n<\/ul>\n<div class=\"tablewrap\"><table>\n<thead><tr><th>표현<\/th><th>문체<\/th><th>뉘앙스<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>など<\/td><td>격식·문어<\/td><td>중립, 겸손<\/td><\/tr>\n<tr><td>なんか<\/td><td>회화<\/td><td>가볍게 낮춤<\/td><\/tr>\n<tr><td>なんて<\/td><td>회화<\/td><td>놀람·무시 (감정 강함)<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>「りんごなど」는 자연스럽지만 「りんごなんて」는 \"사과 따위\"처럼 들려 의미가 달라집니다.<\/p>\n\n<h2>④ やら~やら · とか~とか · だの~だの · にしても~にしても<\/h2>\n<p>크게 <strong>나열<\/strong>(やら・とか・だの)과 <strong>\"~이든 ~이든\"<\/strong>(にしても) 두 그룹입니다.<\/p>\n<blockquote><p>「とか~とかにて」는 쓰이는 문형이 아닙니다. にて는 で의 문어체(「会場にて」 = 회장에서)라서 とか와 붙지 않아요.<\/p><\/blockquote>\n<h3>やら~やら (야라~야라) — 이것저것 많아서 정신없음<\/h3>\n<ul>\n<li>宿題<strong>やら<\/strong>掃除<strong>やら<\/strong>で忙しい。 (슈쿠다이야라 소우지야라데 이소가시이) 숙제다 청소다 해서 바쁘다.<\/li>\n<li>嬉しい<strong>やら<\/strong>恥ずかしい<strong>やら<\/strong>。 (우레시이야라 하즈카시이야라) 기쁘기도 하고 부끄럽기도 하고. (감정이 뒤섞임)<\/li>\n<\/ul>\n<h4>やら~やら — 긍정적인 상황에도 씁니다<\/h4>\n<p>핵심은 좋고 나쁨이 아니라 <strong>\"이것저것 많아서 정리가 안 될 정도\"<\/strong>입니다. 힘든 일에 자주 쓰지만 기쁜 일, 복잡한 감정에도 자연스럽습니다.<\/p>\n<ul>\n<li>引っ越しの準備<strong>やら<\/strong>仕事<strong>やら<\/strong>で、毎日忙しい。<br>(힉코시노 쥼비야라 시고토야라데 마이니치 이소가시이) 이사 준비며 일이며 해서 매일 바쁘다.<\/li>\n<li>誕生日に花<strong>やら<\/strong>ケーキ<strong>やら<\/strong>、たくさんもらった。<br>(탄죠우비니 하나야라 케키야라 타쿠상 모랏타) 생일에 꽃이며 케이크며 잔뜩 받았다.<\/li>\n<li>合格の知らせを聞いて、嬉しい<strong>やら<\/strong>驚く<strong>やら<\/strong>で言葉が出なかった。<br>(고우카쿠노 시라세오 키이테 우레시이야라 오도로쿠야라데 코토바가 데나캇타) 합격 소식을 듣고 기쁘기도 하고 놀랍기도 해서 말이 안 나왔다.<\/li>\n<li>財布をなくす<strong>やら<\/strong>電車に遅れる<strong>やら<\/strong>、ひどい一日だった。<br>(사이후오 나쿠스야라 덴샤니 오쿠레루야라 히도이 이치니치닷타) 지갑은 잃어버리지, 전철은 놓치지, 최악의 하루였다.<\/li>\n<li>パーティーは歌う<strong>やら<\/strong>踊る<strong>やら<\/strong>で大盛り上がりだった。<br>(파티와 우타우야라 오도루야라데 오오모리아가리닷타) 파티는 노래하고 춤추고 해서 엄청 신났다.<\/li>\n<\/ul>\n<blockquote><p><strong>とか~とか와의 차이<\/strong>: とか는 예를 담담하게 늘어놓을 뿐이고, やら에는 \"겹쳐서 감당이 안 될 만큼\"이라는 감정이 실립니다. 「嬉しいやら恥ずかしいやら」처럼 감정 두 개를 함께 쓰는 쓰임은 とか로 바꾸기 어렵습니다.<\/p><\/blockquote>\n<h3>とか~とか (토카~토카) — 가장 일반적·중립적인 회화체 나열<\/h3>\n<ul>\n<li>休みの日は映画<strong>とか<\/strong>ゲーム<strong>とか<\/strong>をする。 (야스미노 히와 에이가토카 게무토카오 스루) 쉬는 날엔 영화라든가 게임 같은 걸 한다.<\/li>\n<li>野菜<strong>とか<\/strong>果物<strong>とか<\/strong>食べたほうがいい。 (야사이토카 쿠다모노토카 타베타호우가 이이) 채소나 과일 같은 걸 먹는 게 좋아.<\/li>\n<\/ul>\n<h4>とか~とか와 비슷한 나열 표현<\/h4>\n<ul>\n<li><strong>や~など<\/strong> (격식·문어체, 명사만): 机の上に本<strong>や<\/strong>ノート<strong>など<\/strong>がある。<br>(츠쿠에노 우에니 홍야 노토나도가 아루) 책상 위에 책이나 노트 등이 있다.<\/li>\n<li><strong>たり~たりする<\/strong> (동사 나열의 기본형): 週末は本を読ん<strong>だり<\/strong>、音楽を聞い<strong>たり<\/strong>する。<br>(슈마츠와 홍오 욘다리 옹가쿠오 키이타리 스루) 주말엔 책을 읽거나 음악을 듣거나 한다.<\/li>\n<li><strong>동사 + とか~とかする<\/strong> (회화): 掃除する<strong>とか<\/strong>洗濯する<strong>とか<\/strong>して過ごした。<br>(소우지스루토카 센타쿠스루토카 시테 스고시타) 청소한다든가 빨래한다든가 하면서 보냈다.<\/li>\n<li><strong>とか 하나만<\/strong>: 부드러운 제안이나 말끝 흐리기. お茶<strong>とか<\/strong>どう? (오챠토카 도우) 차라도 어때? / 来ない<strong>とか<\/strong>言ってたよ。 (코나이토카 잇테타요) 안 온다든가 그러던데.<\/li>\n<\/ul>\n<h3>だの~だの (다노~다노) — 불평·비난 섞인 나열<\/h3>\n<ul>\n<li>疲れた<strong>だの<\/strong>眠い<strong>だの<\/strong>文句ばかり言う。 (츠카레타다노 네무이다노 몽쿠바카리 이우) 피곤하다느니 졸리다느니 불평만 한다.<\/li>\n<li>高い<strong>だの<\/strong>まずい<strong>だの<\/strong>うるさい。 (타카이다노 마즈이다노 우루사이) 비싸다느니 맛없다느니 시끄럽다.<\/li>\n<\/ul>\n<h3>~にしても~にしても (니시테모~니시테모) — 어느 쪽이든 결과는 같다<\/h3>\n<ul>\n<li>行く<strong>にしても<\/strong>行かない<strong>にしても<\/strong>連絡して。 (이쿠니시테모 이카나이니시테모 렌라쿠시테) 가든 안 가든 연락해 줘.<\/li>\n<li>肉<strong>にしても<\/strong>魚<strong>にしても<\/strong>新鮮なのがいい。 (니쿠니시테모 사카나니시테모 신센나노가 이이) 고기든 생선이든 신선한 게 좋다.<\/li>\n<\/ul>\n<div class=\"tablewrap\"><table>\n<thead><tr><th>표현<\/th><th>뉘앙스<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>とか~とか<\/td><td>중립적 나열<\/td><\/tr>\n<tr><td>やら~やら<\/td><td>많아서 정신없음, 감정 뒤섞임<\/td><\/tr>\n<tr><td>だの~だの<\/td><td>불평·비난<\/td><\/tr>\n<tr><td>にしても~にしても<\/td><td>어느 쪽이든<\/td><\/tr>\n<\/tbody><\/table><\/div>\n\n<h2>⑤ というのは vs といえば<\/h2>\n<p>둘 다 화제를 꺼내지만, <strong>というのは<\/strong>는 \"그게 뭔지 설명\", <strong>といえば<\/strong>는 \"그 말을 들으면 떠오르는 것\"입니다.<\/p>\n<h3>というのは (토이우노와) — \"~라는 것은, ~란\" (정의·설명)<\/h3>\n<p>뒤에 「~ことだ」「~という意味だ」가 자주 옵니다. 문장 앞에 단독으로 쓰면 \"왜냐하면\"(뒤에 「~からだ」).<\/p>\n<ul>\n<li>「積ん読」<strong>というのは<\/strong>、本を買って読まないことだ。<br>(츤도쿠토이우노와 홍오 캇테 요마나이 코토다) '츤도쿠'란 책을 사놓고 읽지 않는 것이다.<\/li>\n<li>この「W」<strong>というのは<\/strong>どういう意味ですか。<br>(코노 다브류토이우노와 도우이우 이미데스카) 이 'W'라는 건 무슨 뜻이에요?<\/li>\n<li>明日は休みます。<strong>というのは<\/strong>、病院に行くからです。<br>(아시타와 야스미마스. 토이우노와 뵤우잉니 이쿠카라데스) 내일은 쉽니다. 왜냐하면 병원에 가기 때문입니다.<\/li>\n<\/ul>\n<h4>というのは와 같은 성격의 표현<\/h4>\n<ul>\n<li><strong>とは<\/strong> — というのは의 딱딱한 문어체. 사전적 정의.<br>友達<strong>とは<\/strong>何だろう。 (토모다치토와 난다로우) 친구란 무엇일까.<\/li>\n<li><strong>というものは<\/strong> — 본질·일반적 성질. 감회나 깨달음이 담김.<br>人生<strong>というものは<\/strong>思い通りにならない。 (진세이토이우모노와 오모이도오리니 나라나이) 인생이란 뜻대로 되지 않는 법이다.<\/li>\n<li><strong>ということは<\/strong> — 앞 내용의 의미·결론 풀이.<br>返事がない<strong>ということは<\/strong>、来ないんだろう。 (헨지가 나이토이우코토와 코나인다로우) 답이 없다는 건 안 온다는 거겠지.<\/li>\n<li><strong>って<\/strong> — 회화체.<br>愛<strong>って<\/strong>何? (아잇테 나니) 사랑이란 뭐야?<\/li>\n<\/ul>\n<blockquote><p>목록의 C·D·I(といえば・というと・といったら)는 모양은 비슷하지만 <strong>연상<\/strong> 표현이라 성격이 다릅니다.<\/p><\/blockquote>\n<h3>といえば (토이에바) — \"~라고 하면\" (연상·대표)<\/h3>\n<p>뒤에 그 말을 듣고 떠오르는 대표적인 것이 옵니다. 「そういえば」는 \"그러고 보니\".<\/p>\n<ul>\n<li>日本<strong>といえば<\/strong>富士山だ。<br>(니혼토이에바 후지산다) 일본 하면 후지산이지.<\/li>\n<li>夏<strong>といえば<\/strong>かき氷でしょう。<br>(나츠토이에바 카키고오리데쇼우) 여름 하면 빙수죠.<\/li>\n<li>A「来週京都に行くんだ。」B「京都<strong>といえば<\/strong>、紅葉がきれいだよね。」<br>(쿄우토토이에바 코우요우가 키레이다요네) 교토 하면 단풍이 예쁘지.<\/li>\n<\/ul>\n<div class=\"tablewrap\"><table>\n<thead><tr><th>표현<\/th><th>역할<\/th><th>뒤에 오는 말<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>というのは<\/td><td>뜻·이유 설명<\/td><td>~ことだ / ~意味だ / ~からだ<\/td><\/tr>\n<tr><td>といえば<\/td><td>떠오르는 것<\/td><td>대표적인 예, 관련 화제<\/td><\/tr>\n<\/tbody><\/table><\/div>\n\n<h2>⑥ くらい(ぐらい) vs ばかり<\/h2>\n<h3>くらい (쿠라이) — 정도<\/h3>\n<ul>\n<li><strong>대략<\/strong>: 駅まで10分<strong>くらい<\/strong>です。 (에키마데 쥽풍쿠라이데스) 역까지 10분 정도예요.<\/li>\n<li><strong>정도 비유<\/strong>: 泣きたい<strong>くらい<\/strong>痛い。 (나키타이쿠라이 이타이) 울고 싶을 정도로 아프다.<\/li>\n<li><strong>최소한·하찮음<\/strong>: 挨拶<strong>くらい<\/strong>しなさい。 (아이사츠쿠라이 시나사이) 인사 정도는 해라. / それ<strong>くらい<\/strong>自分でできる。 (소레쿠라이 지분데 데키루) 그 정도는 혼자 할 수 있어.<\/li>\n<\/ul>\n<h3>ばかり (바카리) — 편중·직후<\/h3>\n<ul>\n<li><strong>그것만 잔뜩<\/strong>: 肉<strong>ばかり<\/strong>食べている。 (니쿠바카리 타베테이루) 고기만 먹고 있다. / 文句<strong>ばかり<\/strong>言う。 (몽쿠바카리 이우) 불평만 한다.<\/li>\n<li><strong>막 ~한 참<\/strong> (た형+ばかり): 今起きた<strong>ばかり<\/strong>だ。 (이마 오키타바카리다) 지금 막 일어났다.<\/li>\n<li><strong>대략<\/strong> (격식·예스러움): 1時間<strong>ばかり<\/strong>待った。 (이치지캄바카리 맛타) 1시간쯤 기다렸다.<\/li>\n<\/ul>\n<blockquote><p><strong>구분 포인트<\/strong>: 수량 뒤 \"~정도\"는 둘 다 되지만 보통은 くらい. \"최소한 그 정도는\"이면 くらい, \"그것만 계속\"이나 \"막 ~했다\"면 ばかり.<\/p><\/blockquote>\n\n<h2>⑦ これだけ — \"이만큼, 이렇게나\"<\/h2>\n<p>많은 양·노력을 강조할 때 「これだけ~のだから」(이만큼 했으니까) / 「これだけ~のに」(이렇게나 했는데)로 자주 씁니다. 「これだけは」는 \"이것만은\".<\/p>\n<ul>\n<li><strong>これだけ<\/strong>準備したんだから、きっと大丈夫だ。<br>(코레다케 쥼비시탄다카라 킷토 다이죠우부다) 이만큼 준비했으니까 분명 괜찮을 거야.<\/li>\n<li><strong>これだけ<\/strong>勉強したのに、試験に落ちた。<br>(코레다케 벵쿄우시타노니 시켄니 오치타) 이렇게나 공부했는데 시험에 떨어졌다.<\/li>\n<li><strong>これだけ<\/strong>は覚えておいてください。<br>(코레다케와 오보에테오이테 쿠다사이) 이것만은 기억해 두세요.<\/li>\n<li><strong>あれだけ<\/strong>言ったのに、また忘れたの?<br>(아레다케 잇타노니 마타 와스레타노) 그렇게나 말했는데 또 잊었어?<\/li>\n<\/ul>\n<p>それだけ・あれだけ도 같은 방식이고, 가리키는 대상의 거리(こ・そ・あ)만 다릅니다.<\/p>\n<\/div>\n<\/body><\/html>"};
const REF = "참고 자료";
const START = new Date(2026, 7, 31);
const COLORS = ["#0d7a6f","#b0562b","#5b5fc7","#a2395b","#3f7d20","#8a6a12","#6c6762"];
const $ = s => document.querySelector(s);
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};

const subjects = [...new Set(DOCS.map(d => d.s))];
const byId = Object.fromEntries(DOCS.map(d => [d.id, d]));
let open = new Set(store.get("open", []));
let current = null;

function weekRange(w){
  const a = new Date(START); a.setDate(a.getDate() + (w - 1) * 7);
  const b = new Date(a); b.setDate(b.getDate() + 6);
  return `${a.getMonth()+1}/${a.getDate()} – ${b.getMonth()+1}/${b.getDate()}`;
}
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function render(){
  const q = $("#q").value.trim().toLowerCase();
  const tree = $("#tree");
  tree.classList.toggle("filtering", !!q);
  let html = "";
  subjects.forEach((s, i) => {
    const list = DOCS.filter(d => d.s === s && (!q || (d.l + " " + d.t + " " + d.p).toLowerCase().includes(q)));
    if (q && !list.length) return;
    const weeks = [...new Set(list.map(d => d.w))];
    html += `<section class="subj${open.has(s) ? " open" : ""}" style="--c:${COLORS[i % COLORS.length]}">
      <button data-subj="${esc(s)}" aria-expanded="${open.has(s)}"><span class="dot"></span>${esc(s)}
        <span class="n">${list.length}</span>
        <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
      <div class="weeks">${weeks.map(w => `<div class="wk">
        <h3>${w ? w + "주차" : (s === "중간고사" ? "과목별 정리" : REF)}${w ? `<span>${weekRange(w)}</span>` : ""}</h3>
        ${list.filter(d => d.w === w).map(d =>
          `<button class="doc" data-id="${d.id}" aria-current="${d.id === current}" title="${esc(d.t)}">${esc(d.l)}</button>`).join("")}
      </div>`).join("")}</div></section>`;
  });
  tree.innerHTML = html || `<p class="empty">“${esc(q)}”에 맞는 문서가 없습니다.</p>`;
}

function show(id, {scroll = true} = {}){
  const d = byId[id]; if (!d) return;
  current = id; store.set("last", id);
  if (!open.has(d.s)) { open.add(d.s); store.set("open", [...open]); }
  $("#ttl").textContent = d.l;
  $("#sub").textContent = `${d.s} · ${d.w ? d.w + "주차" : (d.s === "중간고사" ? "과목별 정리" : REF)}`;
  const frame = $("#frame");
  if (INLINE[id]) { if (frame.dataset.inline !== id) { frame.style.height = ""; frame.dataset.inline = id; frame.srcdoc = INLINE[id]; } }
  else if (frame.dataset.inline || !frame.src.endsWith(`d/${id}.html`)) { frame.style.height = ""; delete frame.dataset.inline; frame.removeAttribute("srcdoc"); frame.src = `d/${id}.html`; }
  frame.hidden = false; $("#welcome").hidden = true;
  const same = DOCS.filter(x => x.s === d.s), i = same.indexOf(d);
  $("#prev").disabled = i <= 0; $("#next").disabled = i >= same.length - 1;
  $("#prev").dataset.id = same[i - 1]?.id || ""; $("#next").dataset.id = same[i + 1]?.id || "";
  document.body.classList.add("reading");
  render();
  if (scroll) $(`.doc[data-id="${id}"]`)?.scrollIntoView({block: "nearest"});
}

// iOS는 iframe 내부 스크롤이 불안정해서, iframe 높이를 문서 높이에 맞추고 페이지 전체를 스크롤합니다.
let ro;
$("#frame").addEventListener("load", () => {
  const frame = $("#frame");
  window.scrollTo(0, 0);
  try {
    const doc = frame.contentDocument;
    const m = frame.contentWindow.location.pathname.match(/d\/(\d{3})\.html$/);
    if (m && m[1] !== current) show(m[1]);
    const fit = () => { frame.style.height = doc.documentElement.scrollHeight + "px"; };
    fit();
    ro?.disconnect(); ro = new ResizeObserver(fit); ro.observe(doc.body);
    doc.querySelectorAll('a[href^="http"]').forEach(a => a.target = "_blank");
  } catch (e) { frame.style.height = "85vh"; frame.setAttribute("scrolling", "yes"); }
});

$("#tree").addEventListener("click", e => {
  const doc = e.target.closest(".doc");
  if (doc) return show(doc.dataset.id);
  const sb = e.target.closest("[data-subj]");
  if (sb) {
    const s = sb.dataset.subj;
    open.has(s) ? open.delete(s) : open.add(s);
    store.set("open", [...open]); render();
  }
});
$("#q").addEventListener("input", render);
function setCollapsed(c){
  document.body.classList.toggle("collapsed", c);
  $("#toggle").setAttribute("aria-expanded", String(!c));
  store.set("collapsed", c);
}
$("#toggle").addEventListener("click", () => setCollapsed(!document.body.classList.contains("collapsed")));
setCollapsed(store.get("collapsed", false));
$("#back").addEventListener("click", () => { document.body.classList.remove("reading"); $(`.doc[data-id="${current}"]`)?.scrollIntoView({block: "center"}); });
$("#prev").addEventListener("click", e => e.currentTarget.dataset.id && show(e.currentTarget.dataset.id));
$("#next").addEventListener("click", e => e.currentTarget.dataset.id && show(e.currentTarget.dataset.id));

render();
const fromHash = (location.hash.match(/^#d(\d{3})$/) || [])[1];
const start = fromHash || (matchMedia("(min-width:768px)").matches ? store.get("last", null) : null);
if (start && byId[start]) show(start);
</script>
